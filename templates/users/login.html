{% extends "users/basic.html" %}

{%block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header text-center bg-primary text-white">
                    <h5>
                        <i class="fas fa-sign-in-alt me-2"></i> Login
                    </h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{% url 'login' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}">Username:</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-user"></i>
                                </span>
                                {{ form.username }}
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.password.id_for_label }}">Password:</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                {{ form.password }}
                                <button type="button" id="toggglePassword" title="Toggle password visibility">
                                    <i class="fas fa-eye me-2" id="toggleIcon"></i>
                                </button>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-sign-in-alt me-2"></i> Login
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <a href="{% url 'password_reset' %}" class="text-decoration-none">Forgot Password?</a>
                    <hr>
                    <p class="mb-0">Don't have an account?<a href="{% url 'register' %}" class="text-decoration-none">Sign Up</a></p>
                    
                </div>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
    .card {
        border-radius: 10px;
    }
    .card-header {
        background-color: #007bff;
        color: white;
    }
    .input-group-text {
        background-color: #f8f9fa;
    }
    .form-control:focus {
        box-shadow: none;
        border-color: #007bff;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function(){
        const togglePasswordButton = document.getElementById('toggglePassword');
        const passwordInput = document.getElementById('{{ form.password.id_for_label }}');
        const toggleIcon = document.getElementById('toggleIcon');

        togglePasswordButton.addEventListener('click', function(){
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.classList.toggle('fa-eye');
            toggleIcon.classList.toggle('fa-eye-slash');
        })
    })
</script>
